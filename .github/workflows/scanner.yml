name: Amazon Yalla scanner
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amazon-yalla-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_SESSION_FOLDER_ID: ${{ vars.DRIVE_SESSION_FOLDER_ID }}
      DRIVE_TRACKING_FOLDER_ID: ${{ vars.DRIVE_TRACKING_FOLDER_ID }}
      WORKER_WINDOW_MINUTES: "345"
      SCAN_TIMEOUT_MINUTES: "35"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip -r requirements.txt
        name: Install dependencies
      - run: python -m playwright install --with-deps chromium
        name: Install Chromium
      - name: Run scanner with automatic recovery
        shell: bash
        run: |
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "Starting scanner worker attempt ${attempt}..."
            if python -u scanner.py; then
              echo "Scanner worker finished normally."
              exit 0
            else
              status=$?
              if [ "${attempt}" -ge 4 ]; then
                echo "Scanner failed ${attempt} times; stopping this workflow run."
                exit "${status}"
              fi
              echo "Scanner process exited with status ${status}; restarting in 60 seconds."
              sleep 60
            fi
          done
