name: Green promotion page tracker

on:
  workflow_dispatch:
    inputs:
      continuous:
        description: "Repeat scans with a five-minute rest after each completed scan"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: green-promotion-page-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GREEN_DEALS_TELEGRAM_BOT_TOKEN: ${{ secrets.GREEN_DEALS_TELEGRAM_BOT_TOKEN }}
      GREEN_DEALS_TELEGRAM_CHAT_ID: ${{ secrets.GREEN_DEALS_TELEGRAM_CHAT_ID }}
      GREEN_DEALS_TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.GREEN_DEALS_TELEGRAM_MESSAGE_THREAD_ID }}
      GREEN_DEALS_DATABASE_URL: postgresql://green_deals_bot:${{ secrets.GREEN_DEALS_DB_PASSWORD }}@127.0.0.1:5432/green_deals_storage
      GREEN_DEALS_SCAN_INTERVAL_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open restricted SSH tunnel to Oracle PostgreSQL
        env:
          ORACLE_TUNNEL_PRIVATE_KEY: ${{ secrets.ORACLE_TUNNEL_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_TUNNEL_PRIVATE_KEY" > "$HOME/.ssh/oracle_pg_key"
          chmod 600 "$HOME/.ssh/oracle_pg_key"
          printf '%s %s %s\n' "84.13.143.171" "ssh-ed25519" "AAAAC3NzaC1lZDI1NTE5AAAAIJxRb/5/4wQhsBq5BS8lRPEQNsvS0cAqM52Y7f/fFW8S" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -f -N -M -S "$RUNNER_TEMP/green_deals_tunnel.sock" \
            -L 127.0.0.1:5432:127.0.0.1:5432 \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=60 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/oracle_pg_key" coupon-tunnel@84.13.143.171
      - name: Install tracker dependencies
        run: python -m pip install "playwright>=1.52,<2" "requests>=2.32,<3" "psycopg[binary]>=3.2,<4"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run green promotion page tracker
        run: python -u green_promotion_tracker.py ${{ inputs.continuous && '--continuous' || '' }}
      - name: Close SSH tunnel
        if: always()
        run: |
          ssh -S "$RUNNER_TEMP/green_deals_tunnel.sock" -O exit coupon-tunnel@84.13.143.171 2>/dev/null || true
          rm -f "$HOME/.ssh/oracle_pg_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/green_deals_tunnel.sock"
