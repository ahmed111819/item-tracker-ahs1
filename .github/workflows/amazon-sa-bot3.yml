name: Amazon.sa deal scanners

on:
  workflow_dispatch:
    inputs:
      continuous:
        description: "Repeat: run all three bots, rest 10 minutes after completion, then start again"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: amazon-sa-deal-scanners
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_BACKEND: postgres
      CONTINUOUS_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open restricted SSH tunnel to Oracle PostgreSQL
        env:
          ORACLE_TUNNEL_PRIVATE_KEY: ${{ secrets.ORACLE_TUNNEL_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_TUNNEL_PRIVATE_KEY" > "$HOME/.ssh/oracle_pg_key"
          chmod 600 "$HOME/.ssh/oracle_pg_key"
          printf '%s %s %s\n' "84.13.143.171" "ssh-ed25519" "AAAAC3NzaC1lZDI1NTE5AAAAIJxRb/5/4wQhsBq5BS8lRPEQNsvS0cAqM52Y7f/fFW8S" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -f -N -M -S "$RUNNER_TEMP/oracle_pg_tunnel.sock" \
            -L 127.0.0.1:5432:127.0.0.1:5432 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/oracle_pg_key" \
            coupon-tunnel@84.13.143.171
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run all three bots concurrently
        shell: bash
        run: |
          python -u telegram_callbacks.py > "$RUNNER_TEMP/telegram_callbacks.log" 2>&1 &
          callback_pid=$!
          cleanup() {
            if kill -0 "$callback_pid" 2>/dev/null; then
              kill "$callback_pid" 2>/dev/null || true
            fi
            wait "$callback_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/telegram_callbacks.log" || true
          }
          trap cleanup EXIT

          sleep 2
          if ! kill -0 "$callback_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/telegram_callbacks.log"
            exit 1
          fi

          run_bot() {
            local script="$1"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Starting $script (attempt $attempt/3)"
              if python -u "$script"; then
                return 0
              else
                status=$?
              fi
              echo "$script exited with status $status"
              if [ "$attempt" -eq 3 ]; then
                return "$status"
              fi
              attempt=$((attempt + 1))
              sleep 20
            done
          }

          run_bot scanner_amazon_sa_bot1.py &
          bot1_pid=$!
          run_bot scanner_amazon_sa_bot2.py &
          bot2_pid=$!
          run_bot scanner_amazon_sa_bot3.py &
          bot3_pid=$!

          status=0
          wait "$bot1_pid" || status=1
          wait "$bot2_pid" || status=1
          wait "$bot3_pid" || status=1

          callback_was_running=0
          callback_status=0
          if kill -0 "$callback_pid" 2>/dev/null; then
            callback_was_running=1
            kill "$callback_pid" 2>/dev/null || true
          fi
          wait "$callback_pid" 2>/dev/null || callback_status=$?
          if [ "$callback_was_running" -eq 0 ] && [ "$callback_status" -ne 0 ]; then
            echo "Telegram callback listener exited unexpectedly."
            status=1
          fi
          cat "$RUNNER_TEMP/telegram_callbacks.log"
          python -u telegram_callbacks.py --cleanup-released || status=1
          trap - EXIT
          exit "$status"
      - name: Close SSH tunnel and remove key
        if: always()
        run: |
          ssh -S "$RUNNER_TEMP/oracle_pg_tunnel.sock" -O exit coupon-tunnel@84.13.143.171 2>/dev/null || true
          rm -f "$HOME/.ssh/oracle_pg_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/oracle_pg_tunnel.sock"

  start_next_run:
    needs: scan
    if: ${{ always() && inputs.continuous && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Wait 10 minutes after the scan ends
        run: sleep 600
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run amazon-sa-bot3.yml --repo ahmed111819/item-tracker-ahs1 --ref main -f continuous=true
