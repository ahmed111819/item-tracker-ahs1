name: Amazon.sa deal scanners

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      continuous:
        description: "Keep all three bots scanning, waiting 10 minutes after each bot's scan"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amazon-sa-deal-scanners
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_AMAZON_SA_FOLDER_ID: ${{ vars.DRIVE_AMAZON_SA_FOLDER_ID }}
      CONTINUOUS_MODE: ${{ github.event_name == 'schedule' || inputs.continuous }}
      WORKER_WINDOW_MINUTES: "345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Prepare shared Drive alert registry
        run: python -u prepare_shared_registry.py
      - name: Run all three bots concurrently
        shell: bash
        run: |
          python -u scanner_amazon_sa_bot1.py &
          bot1_pid=$!
          python -u scanner_amazon_sa_bot2.py &
          bot2_pid=$!
          python -u scanner_amazon_sa_bot3.py &
          bot3_pid=$!

          status=0
          wait "$bot1_pid" || status=1
          wait "$bot2_pid" || status=1
          wait "$bot3_pid" || status=1
          exit "$status"
