name: Amazon.sa coupon bot

on:
  workflow_dispatch:
    inputs:
      continuous:
        description: "Repeat: scan once, wait 10 minutes after completion, then scan again"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: amazon-sa-coupon-bot-postgres
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_BACKEND: postgres
      CONTINUOUS_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run the single coupon bot
        run: python -u scanner_amazon_sa_bot1.py

  start_next_run:
    needs: scan
    if: ${{ always() && inputs.continuous && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Wait 10 minutes after the scan ends
        run: sleep 600
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run amazon-sa-bot3.yml --repo ahmed111819/item-tracker-ahs1 --ref main -f continuous=true
