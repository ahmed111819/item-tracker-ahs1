name: Amazon.sa Bot 3 pilot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      continuous:
        description: "Keep scanning and wait 10 minutes after each completed scan"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amazon-sa-bot3-pilot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_BOT3_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_AMAZON_SA_FOLDER_ID: ${{ vars.DRIVE_AMAZON_SA_FOLDER_ID }}
      CONTINUOUS_MODE: ${{ github.event_name == 'schedule' || inputs.continuous }}
      WORKER_WINDOW_MINUTES: "345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Amazon.sa Bot 3
        run: python -u scanner_amazon_sa_bot3.py

