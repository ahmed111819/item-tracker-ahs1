name: Deal parser tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile deal_parser_v2.py scanner_amazon_sa_bot1.py scanner_amazon_sa_bot2.py scanner_amazon_sa_bot3.py
      - name: Run deal classification tests
        run: python -m unittest discover -s tests -v
