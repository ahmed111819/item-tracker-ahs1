name: Verify live price comparison
# Diagnose native store transport failures and security challenges without API keys.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/price-compare-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r price_compare/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s price_compare -p 'test_*.py' -v
      - name: Read live prices for the reported product
        id: amazon
        continue-on-error: true
        run: python price_compare/browser_compare.py --search-provider native --url 'https://www.amazon.sa/dp/B0FQFNYGWZ' --output price_compare/reports/amazon
      - name: Independent test using official product source
        id: official
        continue-on-error: true
        run: python price_compare/browser_compare.py --search-provider native --url 'https://www.apple.com/sa-en/shop/product/mgpg4ze/a/iphone-air-magsafe-battery' --output price_compare/reports/official
      - name: Require an actual readable matching-name store price
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('price_compare/reports').glob('*/report.json'))
          total = 0
          for path in reports:
              r = json.loads(path.read_text())
              assert r['search_provider'] == 'native'
              count = len(r['matches']) + len(r.get('pending', []))
              print(path.parent.name, 'prices:', count, 'searches:', r['searches'])
              total += count
          assert total, 'No external store price verified without paid search'
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-comparison-verification
          path: price_compare/reports/
          retention-days: 7
